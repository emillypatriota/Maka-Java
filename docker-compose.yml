services:
  mysql:
    image: mysql:8
    container_name: maka-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-maka123}
      MYSQL_DATABASE: maka
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - maka-mysql-data:/var/lib/mysql

volumes:
  maka-mysql-data: