<div style="padding: 24px; color: #f3f4f6; background-color: #121212; min-height: 100vh;">
  <h2 style="margin-bottom: 20px; font-weight: 600; color: #ffffff;">Gerenciamento de Pedidos</h2>

  <!-- Barra de Filtros (Dark Mode) -->
  <div style="display: flex; gap: 20px; margin-bottom: 24px; padding: 20px; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 8px;">
    <div>
      <label style="font-size: 14px; color: #9ca3af; display: block; margin-bottom: 6px;">Status:</label>
      <select [(ngModel)]="filtroStatus" style="padding: 8px 12px; background: #2a2a2a; color: #ffffff; border: 1px solid #444; border-radius: 6px; outline: none;">
        <option value="">Todos</option>
        <option value="RECEBIDO">Recebido</option>
        <option value="EM_PREPARO">Em Preparo</option>
        <option value="SAIU_ENTREGA">Saiu para Entrega</option>
        <option value="ENTREGUE">Entregue</option>
      </select>
    </div>

    <div>
      <label style="font-size: 14px; color: #9ca3af; display: block; margin-bottom: 6px;">Canal:</label>
      <select [(ngModel)]="filtroCanal" style="padding: 8px 12px; background: #2a2a2a; color: #ffffff; border: 1px solid #444; border-radius: 6px; outline: none;">
        <option value="">Todos</option>
        <option value="APP">Aplicativo</option>
        <option value="WEB">Site</option>
        <option value="BALCAO">Balcão</option>
      </select>
    </div>

    <div>
      <label style="font-size: 14px; color: #9ca3af; display: block; margin-bottom: 6px;">Data:</label>
      <input type="date" [(ngModel)]="filtroData" style="padding: 7px 12px; background: #2a2a2a; color: #ffffff; border: 1px solid #444; border-radius: 6px; outline-color: #f59e0b;">
    </div>
  </div>

  
  <div style="background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden;">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
      <thead>
        <tr style="background: #252525; color: #9ca3af; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">
          <th style="padding: 14px 16px; border-bottom: 1px solid #2a2a2a;">ID</th>
          <th style="padding: 14px 16px; border-bottom: 1px solid #2a2a2a;">Data/Hora</th>
          <th style="padding: 14px 16px; border-bottom: 1px solid #2a2a2a;">Canal</th>
          <th style="padding: 14px 16px; border-bottom: 1px solid #2a2a2a;">Status</th>
          <th style="padding: 14px 16px; border-bottom: 1px solid #2a2a2a;">Total</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pedido of aplicarFiltros(pedidos$ | async)" style="border-bottom: 1px solid #2a2a2a; color: #e5e7eb; font-size: 14px;">
          <td style="padding: 14px 16px; font-weight: 500;">#{{ pedido.id }}</td>
          <td style="padding: 14px 16px; color: #9ca3af;">{{ pedido.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
          <td style="padding: 14px 16px;">{{ $any(pedido).canal || 'APP' }}</td>
          <td style="padding: 14px 16px;"><span style="background: rgba(245, 158, 11, 0.15); color: #f59e0b; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">{{ pedido.status }}</span></td>
          <td style="padding: 14px 16px; font-weight: 500;">{{ pedido.total | currency:'BRL' }}</td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="aplicarFiltros(pedidos$ | async).length === 0" style="padding: 30px; text-align: center; color: #9ca3af;">
      Nenhum pedido encontrado com esses filtros.
    </div>
  </div>
</div>
