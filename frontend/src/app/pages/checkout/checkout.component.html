<div class="checkout-container">
  <h2>Finalizar Pedido</h2>


  <div class="cart-summary" style="margin-bottom: 1.5rem; padding: 1rem; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb;" *ngIf="cartService.getItems().length > 0">
    <h3 style="font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; color: #374151;">Itens do Pedido</h3>
    <div *ngFor="let item of cartService.getItems()" style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.5rem; color: #4b5563;">
      <span>{{ item.quantity }}x {{ item.name }}</span>
      <span style="font-weight: 500; color: #111827;">R$ {{ (item.price * item.quantity).toFixed(2) }}</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px solid #e5e7eb; color: #059669;">
      <span>Total:</span>
      <span>R$ {{ cartService.getTotal().toFixed(2) }}</span>
    </div>
  </div>

  <form (ngSubmit)="finalizarCompra()">
    <div class="form-group">
      <label for="name">Nome do Cliente:</label>
      <input type="text" id="name" [(ngModel)]="customerName" name="name" required />
    </div>

    <div class="form-group">
      <label for="address">Morada de Entrega:</label>
      <input type="text" id="address" [(ngModel)]="customerAddress" name="address" required />
    </div>

    <div class="form-group">
      <label for="phone">Telemóvel:</label>
      <input type="text" id="phone" [(ngModel)]="customerPhone" name="phone" required />
    </div>

    <div class="form-group">
      <label for="payment">Forma de Pagamento:</label>
      <select id="payment" [(ngModel)]="paymentMethod" name="payment" class="form-control" style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px;">
        <option value="PIX">PIX</option>
        <option value="CARTAO_CREDITO">Cartão de Crédito</option>
        <option value="DINHEIRO">Dinheiro</option>
      </select>
    </div>

    <div class="form-group">
      <label for="observations">Observações (Opcional):</label>
      <textarea id="observations" [(ngModel)]="observations" name="observations" rows="2" style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; resize: vertical;"></textarea>
    </div>

    <button type="submit" class="btn-submit">Confirmar Pedido</button>
  </form>
</div>
