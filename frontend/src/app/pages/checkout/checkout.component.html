<div class="checkout-container">
  <h2>Finalizar Pedido</h2>
  
  <form (ngSubmit)="finalizarCompra()">
    <div class="form-group">
      <label for="name">Nome do Cliente:</label>
      <input type="text" id="name" [(ngModel)]="customerName" name="name" required />
    </div>

    <div class="form-group">
      <label for="address">Morada de Entrega:</label>
      <input type="text" id="address" [(ngModel)]="customerAddress" name="address" required />
    </div>

    <div class="form-group">
      <label for="phone">Telemóvel:</label>
      <input type="text" id="phone" [(ngModel)]="customerPhone" name="phone" required />
    </div>

    <button type="submit" class="btn-submit">Confirmar Pedido</button>
  </form>
</div>
