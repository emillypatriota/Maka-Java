spring.application.name=maka-api
server.port=8080

# Banco (MySQL do docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/maka?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:maka123}

# Quem cria e atualiza o banco é o Flyway (backend/src/main/resources/db/migration).
# O Hibernate só confere (validate); nunca usar ddl-auto=create.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Flyway: scripts V1, V2... rodam sozinhos ao subir a API.
# baseline-version=0 faz um banco antigo (criado antes do Flyway) rodar todos os scripts.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT (troquem o segredo depois; precisa ter 32+ caracteres)
maka.jwt.secret=${JWT_SECRET:maka-segredo-de-desenvolvimento-trocar-depois}
maka.jwt.expiration-ms=28800000

# Frontend Angular
maka.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}