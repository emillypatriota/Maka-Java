spring.application.name=maka-api
server.port=8080

# Banco (MySQL do docker-compose)
spring.datasource.url=jdbc:mysql://localhost:3306/maka?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:maka123}

# O schema.sql já cria as tabelas, então o Hibernate só usa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.sql.init.mode=never

# JWT (troquem o segredo depois; precisa ter 32+ caracteres)
maka.jwt.secret=${JWT_SECRET:maka-segredo-de-desenvolvimento-trocar-depois}
maka.jwt.expiration-ms=86400000

# Frontend Angular
maka.cors.allowed-origins=http://localhost:4200